server {
    listen 80;
    server_name _;

    # Acepta requests con cualquier Host header
    resolver 127.0.0.11 valid=30s;

    # ===== UI estatica (Vite build) =====
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== API Gateway =====
    # /api/charge/*  -> ms-charge-orchestrator:8081/*
    # /api/grid/*    -> ms-grid-load:8082/*
    # /api/billing/* -> ms-billing:8083/*

    location /api/charge/ {
        proxy_pass http://ms-charge-orchestrator:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/grid/ {
        proxy_pass http://ms-grid-load:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/billing/ {
        proxy_pass http://ms-billing:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health del propio gateway
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
