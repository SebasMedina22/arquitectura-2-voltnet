spring:
  application:
    name: ms-billing

  datasource:
    url: jdbc:postgresql://localhost:5433/billing
    username: billing
    password: billing
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: voltnet
    password: voltnet
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ms-billing

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

billing:
  tariff:
    rate: 500.00
    currency: COP
  invoice:
    due-after: PT2M           # 2 minutos (demo)
  scheduler:
    interval-ms: 30000        # cada 30s
    initial-delay-ms: 10000

logging:
  level:
    root: INFO
    com.voltnet.billing: DEBUG
