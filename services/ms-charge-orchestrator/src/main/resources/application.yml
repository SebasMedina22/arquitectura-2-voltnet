spring:
  application:
    name: ms-charge-orchestrator

  datasource:
    url: jdbc:mysql://localhost:3306/orchestrator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: orchestrator
    password: orchestrator
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: voltnet
    password: voltnet
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ms-charge-orchestrator

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Feign client hacia MS-GridLoad
gridload:
  base-url: http://localhost:8082

resilience4j:
  circuitbreaker:
    instances:
      gridload:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  timelimiter:
    instances:
      gridload:
        timeout-duration: 2s

orchestrator:
  rules:
    grid-overload-threshold-kw: 100.0
    user-overdue-blocking-days: 30
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
  seed:
    enabled: true

feign:
  client:
    config:
      default:
        connect-timeout: 2000
        read-timeout: 3000

logging:
  level:
    root: INFO
    com.voltnet.orchestrator: DEBUG
